#docker-compose.yml

version: "3.3"
services:
  redis:
    image: redis:7.0
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    networks:
      - app-network
  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
    depends_on:
      - zookeeper
    networks:
      - app-network
  kafdrop:
    image: obsidiandynamics/kafdrop
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    ports:
      - "9000:9000"
    networks:
      - app-network
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    environment:
      - MLFLOW_TRACKING_URI=postgresql://mlflow:mlflow@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=file:///mlflow/artifacts
      - MLFLOW_MODEL_REGISTRY_URI=postgresql://mlflow:mlflow@postgres:5432/mlflow
      - MLFLOW_SERVE_ARTIFACTS=true
      - MLFLOW_TRACKING_SERVER_HOST=0.0.0.0
      - MLFLOW_TRACKING_SERVER_PORT=5000
      - MLFLOW_TRACKING_SERVER_WORKERS=4
      - MLFLOW_TRACKING_SERVER_WORKER_TIMEOUT=60
      - MLFLOW_TRACKING_SERVER_ENABLE_PROXYFIX=true
    networks:
      - app-network
    depends_on:
      - postgres
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__FERNET_KEY: "yCCu_uGL8H-OAv-Nrv5DbDDbjXFlwBsTxvfNA29jA-k="
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_MODEL_REGISTRY_URI: "http://mlflow:5000"
      MLFLOW_TRACKING_SERVER_HOST: "mlflow"
      MLFLOW_TRACKING_SERVER_PORT: "5000"
      AUTO_PROMOTE_MODEL: "false"
      MODEL_VALIDATION_ENABLED: "true"
      MLFLOW_MODEL_STAGE: "Production"
      PYTHONPATH: "/opt/airflow"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./finetune_lgbm_ranker.py:/opt/airflow/finetune_lgbm_ranker.py
      - ./process_pipeline.py:/opt/airflow/process_pipeline.py
      - ./model_validation.py:/opt/airflow/model_validation.py
      - ./model:/opt/models
      - airflow_logs:/opt/airflow/logs
      - mlflow_data:/mlflow
    user: "0:0"
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - kafka
      - mlflow
    command: >
      bash -c "
        echo 'Initializing Airflow database...';
        airflow db init;
        echo 'Creating admin user...';
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email ducnguyenkudo@gmail.com --password admin || echo 'Admin user already exists or creation failed, continuing...';
        echo 'Setting model directory permissions...';
        chown -R airflow:root /opt/airflow/model && chmod -R 775 /opt/airflow/model;
        chown -R airflow:root /mlflow && chmod -R 775 /mlflow;
        chown -R airflow:root /opt/models && chmod -R 775 /opt/models;
        echo 'Starting webserver...';
        airflow webserver --port 8080 &
        echo 'Starting scheduler...';
        airflow scheduler
      "
  app:
    image: 22520273/session-service-app:latest
    build: .
    volumes:
      - .:/app
      - ./model:/opt/models
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - kafka
      - mlflow
    environment:
      PYTHONUNBUFFERED: "1"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_MODEL_REGISTRY_URI: "http://mlflow:5000"
      MLFLOW_TRACKING_SERVER_HOST: "mlflow"
      MLFLOW_TRACKING_SERVER_PORT: "5000"
      AUTO_PROMOTE_MODEL: "false"
      MODEL_VALIDATION_ENABLED: "true"
      MLFLOW_MODEL_STAGE: "Production"
    networks:
      - app-network
  
  #--------Lab3---------
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - app-network
    depends_on:
      - app
      - node-exporter

  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - app-network
    pid: "host" # Quan trọng: để node-exporter thấy được process của host

  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - app-network

  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    networks:
      - app-network

  promtail:
    image: grafana/promtail:2.8.2
    container_name: promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log # Mount log của host vào container
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:9.5.3
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3002:3000"
    networks:
      - app-network
    depends_on:
      - prometheus
      - loki

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  airflow_logs: {}
  airflow_models:
  mlflow_data:
  postgres_data:
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}