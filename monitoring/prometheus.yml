# monitoring/promethues.yml
global:
  scrape_interval: 10s # Tần suất thu thập metrics

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093" # Trỏ đến service Alertmanager

rule_files:
  - "/etc/prometheus/rules.yml" # Đường dẫn đến file chứa các quy tắc cảnh báo

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fastapi-app"
    static_configs:
      - targets: ["app:8000"] # Trỏ đến service FastAPI app

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"] # Trỏ đến service Node Exporter